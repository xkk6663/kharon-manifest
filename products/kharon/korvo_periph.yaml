# projects/kharon/korvo_periph.yaml —— Kharon 工程登记（app + board）
name: korvo_periph
root: ${ZEPHYR_ROOT}/applications/esp32s31/korvo_periph
pack: zephyr/framework
chip: korvo1
archetype: zephyr
provider: zephyr/west@>=1 <2

build:
  kind: cmake
  source: ${root}/CMakeLists.txt
  work_dir: ${ZEPHYR_ROOT}/build/esp32s31/korvo_periph/default

artifacts:
  elf: ${work_dir}/zephyr/zephyr.elf
  bin: ${work_dir}/zephyr/zephyr.bin
  hex: ${work_dir}/zephyr/zephyr.hex
  map: ${work_dir}/zephyr/zephyr.map

serial:
  port: auto
  baud: 115200

monitor:
  fail_on:
    - { kind: regex, pattern: "FATAL ERROR|ASSERTION FAIL|Unhandled kernel exception" }
  idle_timeout_s: 30
