# projects/kharon/kharon_lcd.yaml
# 1.69" 240x280 IPS（ST7789V + CST816S 触摸）+ LVGL + IO8 八颗 WS2812 + IO48 单颗 RGB
# 板级真相：esp32s3_korvo（esp32s3 / procpu，USB-Serial-JTAG console，COM12）

name: kharon_lcd
root: ${ZEPHYR_ROOT}/applications/esp32s3/kharon_lcd
pack: zephyr/framework
chip: esp32s3_korvo
archetype: zephyr
provider: zephyr/west@>=1 <2

build:
  kind: cmake
  source: ${root}/CMakeLists.txt
  work_dir: ${ZEPHYR_ROOT}/build/esp32s3/kharon_lcd/default

artifacts:
  elf: ${work_dir}/zephyr/zephyr.elf
  bin: ${work_dir}/zephyr/zephyr.bin
  hex: ${work_dir}/zephyr/zephyr.hex
  map: ${work_dir}/zephyr/zephyr.map

serial:
  port: auto
  baud: 115200

monitor:
  fail_on:
    - { kind: regex, pattern: "FATAL ERROR|ASSERTION FAIL|Unhandled kernel exception" }
  idle_timeout_s: 30
